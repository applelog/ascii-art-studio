# GitHub 에 올릴 때(push)와 PR 을 열 때마다 Claude Code 설정(.claude 폴더 등)을
# AgentShield 로 보안 검사한다. 보통(medium) 이상 문제가 있으면 체크가 실패한다.
name: AgentShield

on:
  push:
  pull_request:
  workflow_dispatch: # Actions 탭에서 손으로도 돌릴 수 있게

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # v1.6.0 (커밋으로 고정: 태그가 바뀌어도 같은 코드만 실행)
      - name: AgentShield 보안 검사
        uses: affaan-m/agentshield@b0891303bdcd6037376a94263d45cfd2ff3dfb98
        with:
          path: "."
          min-severity: "medium"
          fail-on-findings: "true"
